[package]
name = "govee-mirror-pc"
description = "A replacement for DreamView on Windows: mirror the screen onto Govee lights over the LAN, one grid cell to one segment. Unofficial."
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/damient/govee-toolkit"
authors = ["damient"]
publish = false

# A workspace of its own: the window and the screen capture stay out of the
# build and the CI of `packages/rust`.
[workspace]

[[bin]]
name = "govee-mirror-pc"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
] }
govee-toolkit = { path = "../../packages/rust", default-features = false, features = ["lan"] }
# The Razer ARGB controller, over USB HID.
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
# The tray icon and its menu.
tray-icon = "0.26"
# The start-with-Windows entry, through a safe API.
winreg = "0.56"
# The `interface` macro, for the `IPolicyConfig` declaration.
windows-core = "0.62"
windows = { version = "0.62", features = [
  # The notification at a headset switch.
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  # The sound outputs, for the headset switch.
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # `DXGI_OUTPUT_DESC` carries an `HMONITOR`.
  "Win32_Graphics_Gdi",
  # The process list, for the profile that a program switches to.
  "Win32_System_Diagnostics_ToolHelp",
  # The CPU and GPU share in the top bar.
  "Win32_System_Performance",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
